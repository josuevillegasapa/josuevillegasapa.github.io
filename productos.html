<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | AndesTech Store</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="Logo AndesTech" onerror="this.style.display='none'">
                <span>AndesTech</span>
            </a>
            <nav class="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="productos.html" class="active">Productos</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="contacto.html">Contacto</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="faq.html">FAQ</a>
                <a href="carrito.html" class="btn-carrito">🛒 Carrito (<span id="contador-carrito">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="container seccion">
        <h1 class="titulo-seccion">Catálogo de Productos</h1>

        <!-- Panel de Filtros y Búsqueda -->
        <section class="panel-filtros">
            <input type="text" id="buscador" placeholder="Buscar producto por nombre..." class="input-control">
            
            <select id="filtro-categoria" class="input-control">
                <option value="todas">Todas las categorías</option>
                <!-- Opciones cargadas dinámicamente desde productos.json -->
            </select>

            <select id="filtro-stock" class="input-control">
                <option value="todos">Todos (Disponibles y Agotados)</option>
                <option value="disponible">Solo Disponibles</option>
                <option value="agotado">Agotados</option>
            </select>

            <select id="orden-precio" class="input-control">
                <option value="defecto">Ordenar por precio</option>
                <option value="asc">Menor a mayor precio (Bs)</option>
                <option value="desc">Mayor a menor precio (Bs)</option>
            </select>
        </section>

        <!-- Grid de Tarjetas de Productos -->
        <section class="grid-productos" id="catalogo-productos">
            <!-- Tarjetas generadas dinámicamente por productos.js -->
        </section>
    </main>

    <!-- Modal para Ver Detalles del Producto -->
    <div id="modal-detalle" class="modal oculto">
        <div class="modal-contenido">
            <span class="cerrar-modal" id="cerrar-modal">&times;</span>
            <div id="contenido-modal-detalle">
                <!-- Detalles del producto inyectados por JS -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 AndesTech Store - Todos los derechos reservados.</p>
            <p>Oruro, Bolivia | Precios expresados en Bolivianos (Bs)</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
